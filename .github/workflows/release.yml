# Builds MeshRF for every supported platform and attaches the artifacts to a
# GitHub release. Native libraries cannot be cross-compiled, so each platform
# builds on its own runner — this workflow is the only way mac/linux artifacts
# get produced without owning those machines.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (defaults to VersionPrefix in Directory.Build.props)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not discard artifacts the others already
      # produced — especially macOS, whose native build is unverified.
      fail-fast: false
      matrix:
        include:
          # windows-latest works again: the windows-x64 preset no longer pins a
          # generator, so CMake picks whatever Visual Studio the image ships
          # (2026 here, 2022 on developer machines).
          - os: windows-latest
            platform: windows
            artifact: dist/*.zip
          - os: ubuntu-latest
            platform: linux
            artifact: dist/*.tar.gz
          # GitHub's public arm64 runners, free on public repos. A native
          # build, not a cross-compile: nothing here can cross-compile, and
          # this is the artifact a Raspberry Pi or a uConsole needs — which is
          # also the only hardware the SPI radio path can run on.
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            artifact: dist/*.tar.gz
          - os: macos-latest
            platform: macos
            artifact: dist/*.zip

    runs-on: ${{ matrix.os }}
    # macOS is expected to fail until someone verifies the native build there,
    # and linux-arm64 has never been run on real hardware either; let both
    # report red without blocking the release.
    continue-on-error: ${{ matrix.platform == 'macos' || matrix.platform == 'linux-arm64' }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # Radio backends are dlopen'd at runtime rather than linked, so the dev
      # packages only need to exist at build time for the headers.
      #
      # The autotools and libudev entries are for vcpkg's own libusb port,
      # which autoreconfs from source and names these itself when they are
      # missing ("libusb currently requires the following tools and libraries
      # from the system package manager: libudev").
      - name: Install native dependencies (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libhackrf-dev librtlsdr-dev libusb-1.0-0-dev \
                                  libudev-dev autoconf autoconf-archive automake libtool

      # The runner image arrives with third-party taps we never install from
      # (aws/tap at the time of writing), and Homebrew now prints a tap-trust
      # warning naming them on every single invocation. Dropping them from this
      # throwaway runner is quieter than exporting HOMEBREW_NO_REQUIRE_TAP_TRUST,
      # which switches the check off wholesale and is on its way out. Everything
      # installed below comes from homebrew/core, which is left alone.
      - name: Drop untrusted Homebrew taps (macOS)
        if: matrix.platform == 'macos'
        run: |
          # Only taps nothing is installed from. brew rightly refuses to untap
          # one that owns an installed formula (hashicorp/tap owns packer on
          # this image, azure/bicep owns bicep), and asking it to anyway prints
          # an error for something that was never a problem.
          installed=$(brew list --full-name || true)
          for tap in $(brew tap | grep -v '^homebrew/'); do
            if printf '%s\n' "$installed" | grep -q "^$tap/"; then
              echo "Keeping $tap: the image has formulae installed from it"
              continue
            fi
            echo "Untapping $tap"
            brew untap "$tap" || true
          done

      - name: Install native dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install ninja hackrf librtlsdr libusb autoconf autoconf-archive automake libtool

      # A full clone, deliberately: vcpkg.json pins a "builtin-baseline" commit
      # that a shallow clone cannot resolve, and a blob-filtered clone makes
      # every pinned-port checkout a network fetch. On Windows, CMakeLists.txt
      # provisions vcpkg itself the same way.
      - name: Set up vcpkg
        if: matrix.platform != 'windows'
        run: |
          # vcpkg ships no prebuilt tools for arm64 Linux, so both its own
          # bootstrap and every port build have to use the system's cmake,
          # ninja and compiler. Set only where it applies: vcpkg treats the
          # variable as set even when empty, so exporting it unconditionally
          # would change the x64 build too.
          if [ "${{ matrix.platform }}" = "linux-arm64" ]; then
            echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"
            export VCPKG_FORCE_SYSTEM_BINARIES=1
          fi
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      # Check the tag against the declared repo version: a mismatch fails
      # loudly here rather than silently producing artifacts whose names
      # disagree with the release they are attached to.
      - name: Check tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $declared = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.VersionPrefix |
                        Where-Object { $_ } | Select-Object -First 1
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          if ($declared -ne $tag) {
            throw "Tag v$tag does not match VersionPrefix $declared in Directory.Build.props."
          }
          Write-Host "Tag v$tag matches the declared version."

      - name: Build release
        shell: pwsh
        run: |
          # Hashtable splat, not an array: array splatting binds positionally,
          # so @('-Version','1.2.3') would put the literal string "-Version"
          # into the script's first parameter and publish "MeshRF v-Version".
          $params = @{}
          # Only an explicit workflow_dispatch input overrides; otherwise the
          # app uses the version it declares.
          if ('${{ inputs.version }}') { $params.Version = '${{ inputs.version }}' }
          ./scripts/build-release.ps1 @params

      # ExternalProject writes each step's output to a stamp log and only
      # reports "exited with code 1" to the console, so a vendored-submodule
      # failure is undiagnosable from the job log alone.
      - name: Dump vendored-submodule build logs
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for f in build/*/[a-z]*-prefix/src/*-stamp/*.log; do
            found=1
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "No ExternalProject stamp logs found."

      - uses: actions/upload-artifact@v7
        with:
          name: meshrf-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    # Only a tag push publishes; workflow_dispatch is for test builds, which
    # stop at the uploaded artifacts.
    #
    # !cancelled() rather than plain success(): a failing matrix leg would
    # otherwise skip this job entirely, and macOS is expected to fail until
    # someone verifies its native build. Publish whatever did build; the guard
    # below refuses to create an empty release.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Check something was built
        run: |
          count=$(find artifacts -type f | wc -l)
          echo "Downloaded $count artifact file(s):"
          find artifacts -type f -printf '  %f (%s bytes)\n'
          if [ "$count" -eq 0 ]; then
            echo "::error::No artifacts were produced; refusing to create an empty release."
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
