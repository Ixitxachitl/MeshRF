# Builds MeshRF for every supported platform and attaches the artifacts to a
# GitHub release. Native libraries cannot be cross-compiled, so each platform
# builds on its own runner — this workflow is the only way mac/linux artifacts
# get produced without owning those machines.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (defaults to VersionPrefix in Directory.Build.props)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not discard artifacts the others already
      # produced — especially macOS, whose native build is unverified.
      fail-fast: false
      matrix:
        include:
          # Pinned, not windows-latest: that image is now windows-2025-vs2026,
          # which ships Visual Studio 2026, and the windows-x64 preset asks for
          # the "Visual Studio 17 2022" generator. A preset that names a
          # generator cannot be overridden with -G, so the runner has to match
          # the preset until the preset learns to pick whatever VS is present.
          - os: windows-2022
            platform: windows
            # The last WPF release ships alongside the first Avalonia one; after
            # that this becomes 'Avalonia'.
            app: Both
            artifact: dist/*.zip
          - os: ubuntu-latest
            platform: linux
            app: Avalonia
            artifact: dist/*.tar.gz
          - os: macos-latest
            platform: macos
            app: Avalonia
            artifact: dist/*.zip

    runs-on: ${{ matrix.os }}
    # macOS is expected to fail until someone verifies the native build there;
    # let it report red without blocking the release.
    continue-on-error: ${{ matrix.platform == 'macos' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Radio backends are dlopen'd at runtime rather than linked, so the dev
      # packages only need to exist at build time for the headers.
      #
      # The autotools and libudev entries are for vcpkg's own libusb port,
      # which autoreconfs from source and names these itself when they are
      # missing ("libusb currently requires the following tools and libraries
      # from the system package manager: libudev").
      - name: Install native dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libhackrf-dev librtlsdr-dev libusb-1.0-0-dev \
                                  libudev-dev autoconf autoconf-archive automake libtool

      - name: Install native dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install ninja hackrf librtlsdr libusb autoconf autoconf-archive automake libtool

      # A full clone, deliberately: vcpkg.json pins a "builtin-baseline" commit
      # that a shallow clone cannot resolve, and a blob-filtered clone makes
      # every pinned-port checkout a network fetch. On Windows, CMakeLists.txt
      # provisions vcpkg itself the same way.
      - name: Set up vcpkg
        if: matrix.platform != 'windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      # The two apps carry their own versions, so a tag cannot simply be forced
      # onto both. Check the tag against the repo version instead: a mismatch
      # fails loudly here rather than silently producing artifacts whose names
      # disagree with the release they are attached to.
      - name: Check tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $declared = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.VersionPrefix |
                        Where-Object { $_ } | Select-Object -First 1
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          if ($declared -ne $tag) {
            throw "Tag v$tag does not match VersionPrefix $declared in Directory.Build.props."
          }
          Write-Host "Tag v$tag matches the declared version."

      - name: Build release
        shell: pwsh
        run: |
          # Hashtable splat, not an array: array splatting binds positionally,
          # so @('-App','Avalonia') put the literal string "-App" into the
          # script's first parameter ($Version) and published "MeshRF v-App".
          $params = @{ App = '${{ matrix.app }}' }
          # Only an explicit workflow_dispatch input overrides; otherwise each
          # app uses the version it declares.
          if ('${{ inputs.version }}') { $params.Version = '${{ inputs.version }}' }
          ./scripts/build-release.ps1 @params

      # ExternalProject writes each step's output to a stamp log and only
      # reports "exited with code 1" to the console, so a vendored-submodule
      # failure is undiagnosable from the job log alone.
      - name: Dump vendored-submodule build logs
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for f in build/*/[a-z]*-prefix/src/*-stamp/*.log; do
            found=1
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "No ExternalProject stamp logs found."

      - uses: actions/upload-artifact@v4
        with:
          name: meshrf-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    # Only a tag push publishes; workflow_dispatch is for test builds, which
    # stop at the uploaded artifacts.
    #
    # !cancelled() rather than plain success(): a failing matrix leg would
    # otherwise skip this job entirely, and macOS is expected to fail until
    # someone verifies its native build. Publish whatever did build; the guard
    # below refuses to create an empty release.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check something was built
        run: |
          count=$(find artifacts -type f | wc -l)
          echo "Downloaded $count artifact file(s):"
          find artifacts -type f -printf '  %f (%s bytes)\n'
          if [ "$count" -eq 0 ]; then
            echo "::error::No artifacts were produced; refusing to create an empty release."
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
