# Mirrors recent lightning strikes within 30 miles as point waypoints.
#
# CREDENTIAL
#   Name           xweather-pair
#   Attach as      Query
#   Parameter      client_id        Value      your Xweather client id
#   2nd parameter  client_secret    2nd value  your Xweather client secret
#
# Xweather's free tier is not adequate for sustained lightning tracking. The
# allowance is counted in accesses rather than requests, and a lightning request
# costs about ten of them. At the every: below that is 288 requests a day, near
# enough 2,900 accesses, so the free tier's 15,000 are gone in under a week —
# and that is this script alone, before anything else on the account asks for
# weather. It is enough to point this at the API and confirm the paths resolve.
# It is not enough to leave running.
#
# What makes running out worse than an ordinary outage is that the map cannot
# say it happened: no strikes returned looks exactly like no strikes in the sky.
# The markers already placed either sit out their hour or retire at once,
# depending on the shape of the error body, and either way the map quietly stops
# tracking the storm you are watching it for. The log is the only place the
# failure shows — check it there rather than waiting for markers. Weather you
# intend to rely on means a paid plan.
#
# Each strike is a single point — no geofence, because a strike is a place
# something happened rather than an area to be warned about entering.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE ENABLING. A storm produces strikes continuously, and every
# one inside the window becomes a waypoint on everyone's map. Four markers is
# fine; forty is a nuisance and a lot of airtime even spaced out.
#
# limit= and from= below are what keep that in hand — they cap how many strikes
# can be in play at once and how far back it looks. Start with Dry run on during
# actual weather and see how many it reports before letting it transmit.
#
# The items: path below is confirmed against a live response. The paths within
# each record are not, for want of a storm to produce one — if markers never
# appear during weather, the log carries the start of the response alongside the
# path it could not follow, which is enough to correct them.
# ---------------------------------------------------------------------------

enabled: false

alias: Lightning strikes nearby

sync:
  # Shorter than the window below, so a strike is seen before it ages out.
  every: 5m

  # from=-15m is the window; strikes older than that drop out of the feed and
  # their markers are retired automatically. limit caps a busy storm.
  #
  # The unit has to be a single letter. Xweather takes -15m and -1h, but answers
  # a spelled-out -15minutes with success:true, a warn_invalid_param it buries in
  # the body, and a window of its own choosing.
  url: "https://data.api.xweather.com/lightning/closest?p={my.lat},{my.lon}&radius=30mi&limit=10&from=-15m&format=json"
  credential: xweather-pair
  timeout: 20s

  items: response
  id: id
  lat: loc.lat
  lon: loc.long

  # The URL already asks for a radius; this catches the case where it is
  # ignored, and says out loud what the script is for.
  within: 30mi

  # Empty on purpose: a strike is a moment, not a thing that changes. Nothing
  # is ever resent, and a marker is placed once and retired once. Without the
  # key at all the editor would warn that nothing can ever update.
  watch: []

  waypoint:
    name: "Lightning"
    # No description. Anything here has to come from the record: {time} would
    # re-render every poll, making every strike look changed and resending the
    # lot. The editor warns if you try.
    icon: "⚡"
    # No radius, so this is a bare point.
    #
    # An hour, unlike the fire sync's markers: a strike leaves the feed within
    # fifteen minutes and is retired then, so this only matters if the sync
    # stops running — in which case an hour-old strike is not worth keeping.
    expires: 1h

    # Deliberately not the primary. Strikes arrive in bursts and are of
    # interest to whoever is watching the weather rather than to the whole
    # mesh, so they go on a channel people can opt into — change the name to
    # one you have, or use   channel: "{primary}"   to put them in front of
    # everyone, or   to: "!a1b2c3d4"   to send them to one node only.
    #
    # A name that matches no channel falls back to the primary and says so in
    # the log, which is not what you want happening during a storm.
    channel: Weather
