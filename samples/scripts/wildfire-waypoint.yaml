# Drops a waypoint on an active Watch Duty wildfire within 30 miles.
#
# No credential needed — the API is open.
#
# ---------------------------------------------------------------------------
# The field names below come from a working Home Assistant integration against
# the same endpoint, so they are not guesses: lat and lng are top level, while
# acreage and containment live under data. The one thing still unconfirmed is
# whether the list arrives wrapped in results[] — the sibling /reports/ endpoint
# is paginated that way, and this one is filtered the same, so it almost
# certainly is. If nothing ever fires, delete the json: block, turn Dry run on,
# and the log prints the whole response as {http.body}; the wrapper will be
# obvious.
#
# The endpoint returns every incident, active or not, with no way to narrow by
# distance — the Home Assistant integration measures each one locally, and the
# within: test below does the same thing here.
# ---------------------------------------------------------------------------

enabled: false

alias: Wildfire within 30 miles

trigger:
  # Fires move slowly compared with lightning and the reports are human-filed,
  # so there is nothing to gain from looking more often.
  - every: 30m

action:
  # Nothing to measure distance from without a home location.
  - require:
      value: "{my.lat}"
      not_empty: true

  - http:
      url: "https://api.watchduty.org/api/v1/geo_events/?geo_event_types=*"
      optional: true
      timeout: 20s
      # Uncomment if the request comes back 406: some edge filters reject an
      # unfamiliar client, and this presents a browser's instead.
      # headers:
      #   User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
      #   Accept: "application/json"
      json:
        active: results[0].is_active
        name: results[0].name
        lat: results[0].lat
        lon: results[0].lng
        acreage: results[0].data.acreage
        containment: results[0].data.containment

  # The endpoint returns closed incidents too, and the integration skips
  # anything without is_active. So does this.
  - require:
      value: "{http.active}"
      equals: "true"

  # The distance filter the API does not offer. Without it this would mark
  # whichever fire came back first, anywhere in the state.
  - require:
      value: "{http.lat},{http.lon}"
      within: 30mi

  - waypoint:
      lat: "{http.lat}"
      lon: "{http.lon}"
      name: "Fire: {http.name}"
      description: "{http.acreage} acres, {http.containment}% contained"
      icon: "🔥"
      radius: 10mi
      expires: 6h
      notify_on_enter: true

  - log: "wildfire {http.name} at {http.lat},{http.lon} — {http.acreage} acres, {http.containment}% contained"

limits:
  # Six hours, matching the waypoint's own life: a fire burns for days, and a
  # fresh marker every half hour would be noise on everyone's map.
  cooldown: 6h
  max_per_hour: 1
