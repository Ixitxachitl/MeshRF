# Drops a waypoint on an active Watch Duty wildfire within 30 miles.
#
# No credential needed — the API is open.
#
# ---------------------------------------------------------------------------
# Everything here follows a working Home Assistant integration against the same
# endpoint, rather than a guess at the shape:
#
#   * The reply is a bare array, not a paginated object — its coordinator
#     returns resp.json() untouched and iterates it directly. Hence [0] rather
#     than results[0], unlike the sibling /reports/ endpoint.
#   * lat and lng are top level; acreage and containment are under data.
#   * Closed incidents come back too, so is_active has to be checked.
#   * There is no way to narrow by distance, which is why the integration
#     measures each incident locally. The within: test below does the same.
#
# The headers are the ones that integration sends. A bare request is answered
# with 406 Not Acceptable, so they are not optional.
# ---------------------------------------------------------------------------

enabled: false

alias: Wildfire within 30 miles

trigger:
  # Fires move slowly compared with lightning and the reports are human-filed,
  # so there is nothing to gain from looking more often.
  - every: 30m

action:
  # Nothing to measure distance from without a home location.
  - require:
      value: "{my.lat}"
      not_empty: true

  - http:
      url: "https://api.watchduty.org/api/v1/geo_events/?geo_event_types=*"
      optional: true
      timeout: 20s
      # Not optional: without these the endpoint answers 406 Not Acceptable.
      headers:
        Accept: "application/json, text/plain, */*"
        User-Agent: "MeshRF/2 (https://github.com/Ixitxachitl/MeshRF)"
      json:
        active: "[0].is_active"
        name: "[0].name"
        lat: "[0].lat"
        lon: "[0].lng"
        acreage: "[0].data.acreage"
        containment: "[0].data.containment"

  # The endpoint returns closed incidents too, and the integration skips
  # anything without is_active. So does this.
  - require:
      value: "{http.active}"
      equals: "true"

  # The distance filter the API does not offer. Without it this would mark
  # whichever fire came back first, anywhere in the state.
  - require:
      value: "{http.lat},{http.lon}"
      within: 30mi

  - waypoint:
      lat: "{http.lat}"
      lon: "{http.lon}"
      name: "Fire: {http.name}"
      description: "{http.acreage} acres, {http.containment}% contained"
      icon: "🔥"
      radius: 10mi
      expires: 6h
      notify_on_enter: true

  - log: "wildfire {http.name} at {http.lat},{http.lon} — {http.acreage} acres, {http.containment}% contained"

limits:
  # Six hours, matching the waypoint's own life: a fire burns for days, and a
  # fresh marker every half hour would be noise on everyone's map.
  cooldown: 6h
  max_per_hour: 1
