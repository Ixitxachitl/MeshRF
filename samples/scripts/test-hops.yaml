# Reacts to anything saying "test" on the Test channel with a hop-count keycap.
#
# A range check you can read at a glance: whoever sent it gets back 0️⃣ if you
# heard them directly, 1️⃣ if one node relayed it, and so on. Nothing to
# configure — the only thing it needs is a channel named Test.

enabled: false

alias: React to "test" on Test with a hop-count keycap

trigger:
  # The word on its own, not any word containing it, so "latest" is left alone.
  # Text triggers are case-insensitive unless you say otherwise, which is what
  # matches Test, TEST and test alike.
  - text: '\btest\b'

condition:
  # The Test channel only. A direct message arrives on "PKC" rather than a
  # channel name, so this keeps the script off your DMs too.
  - channel: Test

action:
  # A tapback rather than a message: it lands on the message it counted instead
  # of adding a line to the channel, which is the whole point when the same word
  # is being sent over and over. The keycap filter turns the count into
  # 0⃣ … 🔟; {hops} on its own is the plain number.
  - react: "{hops|keycap}"

limits:
  # A minute per node. Range testing means sending the same word repeatedly from
  # a moving position, and answering every one of those would put more traffic
  # on the channel than the test itself.
  cooldown: 60s
  per_node: true
  max_per_hour: 10
