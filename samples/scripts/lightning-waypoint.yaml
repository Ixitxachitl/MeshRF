# Drops a waypoint on the nearest lightning strike within 30 miles.
#
# CREDENTIAL
#   Name           xweather-pair
#   Attach as      Query
#   Parameter      client_id        Value      your Xweather client id
#   2nd parameter  client_secret    2nd value  your Xweather client secret
#
# Xweather also issues a single API key. It is not used here: a bearer header
# was rejected with invalid_client, and the id/secret pair is what this endpoint
# accepts.
#
# The search is centred on this node's home location (My Node -> Home), so
# there is nothing to edit when you move.

enabled: false

alias: Lightning within 30 miles

trigger:
  # How often it looks. The cooldown below is what stops it re-marking the same
  # storm over and over.
  - every: 10m

action:
  # Without a home location there is nowhere to search from and the request
  # would go out malformed. Stop before spending it.
  - require:
      value: "{my.lat}"
      not_empty: true

  # optional: true because "no lightning anywhere near" is the normal answer,
  # not a fault — without it the missing response[0] would log an error every
  # ten minutes. The require: below turns the empty answer into a quiet stop.
  - http:
      url: "https://data.api.xweather.com/lightning/closest?p={my.lat},{my.lon}&radius=30mi&limit=1&format=json"
      credential: xweather-pair
      optional: true
      timeout: 20s
      json:
        lat: response[0].loc.lat
        lon: response[0].loc.long

  # Nothing in range: stop here, quietly.
  - require:
      value: "{http.lat}"
      not_empty: true

  - waypoint:
      lat: "{http.lat}"
      lon: "{http.lon}"
      name: "Lightning"
      description: "Strike detected at {time}"
      icon: "⛈"
      radius: 30mi
      expires: 1h
      notify_on_enter: true

  - log: "lightning at {http.lat},{http.lon}"

limits:
  # An hour between markers: a storm strikes continuously, and a waypoint every
  # ten minutes would bury the map and the channel.
  cooldown: 1h
  max_per_hour: 2
